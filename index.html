<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172019">
    <title>문파계승</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite">
      <section id="welcomeView" class="welcome-view">
        <div class="welcome-copy">
          <p class="kicker">Munpa Legacy</p>
          <h1>문파계승</h1>
          <p>제자를 기르고 계절을 넘기며 다음 세대까지 문파의 이름을 남기세요.</p>
        </div>
        <div class="welcome-actions">
          <button id="continueGame" class="secondary-action" type="button" hidden>계속하기</button>
          <button id="newGame" class="primary-action" type="button">새 게임</button>
        </div>
      </section>

      <section id="founderView" class="founder-view" hidden>
        <header class="creation-header">
          <p class="kicker">개파조사</p>
          <h1>첫 문주를 정하세요</h1>
        </header>

        <form id="founderForm" class="founder-form">
          <fieldset class="portrait-picker">
            <legend>초상화</legend>
            <div id="portraitOptions" class="portrait-options"></div>
          </fieldset>

          <label class="name-field" for="sectNameInput">
            <span>문파 이름</span>
            <div class="name-row">
              <input id="sectNameInput" name="sectName" type="text" maxlength="12" autocomplete="off">
              <button id="randomSectName" class="icon-action" type="button" aria-label="문파 이름 무작위" title="문파 이름 무작위">
                <svg class="dice-icon" aria-hidden="true" viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                  <circle cx="8" cy="8" r="1.6"></circle>
                  <circle cx="16" cy="8" r="1.6"></circle>
                  <circle cx="8" cy="16" r="1.6"></circle>
                  <circle cx="16" cy="16" r="1.6"></circle>
                  <circle cx="12" cy="12" r="1.6"></circle>
                </svg>
              </button>
            </div>
          </label>

          <label class="name-field" for="founderName">
            <span>개파조사 이름</span>
            <div class="name-row">
              <input id="founderName" name="founderName" type="text" maxlength="12" autocomplete="off">
              <button id="randomName" class="icon-action" type="button" aria-label="이름 무작위" title="이름 무작위">
                <svg class="dice-icon" aria-hidden="true" viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                  <circle cx="8" cy="8" r="1.6"></circle>
                  <circle cx="16" cy="8" r="1.6"></circle>
                  <circle cx="8" cy="16" r="1.6"></circle>
                  <circle cx="16" cy="16" r="1.6"></circle>
                  <circle cx="12" cy="12" r="1.6"></circle>
                </svg>
              </button>
            </div>
          </label>

          <p class="creation-note">개파조사는 35세, 수명 120, 건강 100으로 시작합니다.</p>
          <button class="primary-action" type="submit">개파하기</button>
        </form>
      </section>

      <section id="gameView" class="game-view" hidden>
        <header class="fixed-status">
          <div class="sect-header">
            <div>
              <p class="kicker">현재 문파</p>
              <h1 id="sectName">-</h1>
            </div>
            <div class="header-actions">
              <p id="saveState" class="save-state">저장 확인 중</p>
              <button id="returnWelcome" class="secondary-action compact-action" type="button">처음으로</button>
            </div>
          </div>

          <div class="hud-row">
            <button id="founderCard" class="founder-card" type="button" aria-label="개파조사 상세 정보 열기">
              <div id="founderPortrait" class="portrait portrait-small"></div>
              <div>
                <p class="kicker">개파조사</p>
                <h3 id="founderNameDisplay">-</h3>
                <p id="founderMeta">-</p>
              </div>
            </button>

            <article class="time-card" aria-label="현재 시간">
              <h3 id="seasonText">1년 봄</h3>
            </article>
          </div>
        </header>

        <div class="status-pane">
          <section class="scene-panel" aria-label="문파 상태">
            <div class="scene-text">
              <h2 id="mainStatus">문파를 정비하는 중입니다</h2>
            </div>
            <div class="disciple-list" aria-label="제자 목록">
              <h3>제자</h3>
              <div id="discipleList"></div>
            </div>
          </section>

          <section id="recruitmentPanel" class="recruitment-panel" aria-label="제자 모집" hidden>
            <div class="panel-heading">
              <div>
                <p class="kicker">제자 모집</p>
                <h2>후보 판정</h2>
              </div>
              <button id="closeRecruitment" class="secondary-action compact-action" type="button">닫기</button>
            </div>

            <div class="bulk-actions" aria-label="전체 판정">
              <button data-bulk-decision="defer" type="button">전체 유예</button>
              <button data-bulk-decision="reject" type="button">전체 불합격</button>
              <button data-bulk-decision="accept" type="button">전체 합격</button>
            </div>

            <div id="candidateList" class="candidate-list"></div>

            <div class="confirm-actions">
              <button id="cancelRecruitment" class="secondary-action" type="button">취소</button>
              <button id="confirmRecruitment" class="primary-action" type="button">확인</button>
            </div>
          </section>
        </div>

        <nav class="menu-bar" aria-label="게임 메뉴">
          <button id="openRecruitment" type="button">제자 모집</button>
          <button id="endTurn" type="button">턴 종료</button>
        </nav>
      </section>

      <div id="founderModal" class="modal-backdrop" hidden>
        <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="founderModalTitle">
          <div class="panel-heading">
            <div>
              <p class="kicker">상세 정보</p>
              <h2 id="founderModalTitle">개파조사</h2>
            </div>
            <button id="closeFounderModal" class="secondary-action compact-action" type="button">닫기</button>
          </div>
          <div id="founderDetail" class="detail-grid"></div>
        </section>
      </div>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
